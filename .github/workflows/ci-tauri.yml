name: Validate Tauri

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Rust tests
        run: npm run selftest
      - name: Build frontend
        run: npm run build:tauri:web

  bundle-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build unsigned ARM64 NSIS on a clean runner
        run: npx tauri build --ci --no-sign --bundles nsis --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: witch-clipboard-arm64-unsigned-ci
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
