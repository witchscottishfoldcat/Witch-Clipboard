name: Release Tauri installers

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      # tauri-action updates latest.json with a read/merge/delete/upload sequence. Serializing
      # architectures prevents two matrix jobs from losing each other's platform entry.
      max-parallel: 1
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate updater signing configuration
        shell: pwsh
        env:
          WCC_UPDATER_PUBLIC_KEY: ${{ vars.WCC_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WCC_UPDATER_PUBLIC_KEY)) { throw 'Missing WCC_UPDATER_PUBLIC_KEY repository variable' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret' }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WCC_UPDATER_PUBLIC_KEY: ${{ vars.WCC_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Witch Clipboard __VERSION__
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
