<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>WitchCat Clipboard · 托盘图标</title>
  <!--
    托盘版：16~32px 下胡须、鼻子、帽带都会糊成一团，全部去掉，
    只留「白板面 + 两只耳朵 + 深色尖帽 + 两只眼睛」的剪影，
    并把帽子和眼睛整体放大一档，保证在任务栏里认得出。
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)" />

  <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round">
    <path d="M166 244 L136 112 L232 196 Z" />
    <path d="M346 244 L376 112 L280 196 Z" />
  </g>

  <rect x="130" y="200" width="252" height="220" rx="48" fill="#ffffff" />

  <!-- 帽子少倾斜一点：倾太多会把左边那只耳朵整个盖住，小尺寸下就看不出是猫了 -->
  <g transform="rotate(-9 256 204)">
    <path
      d="M256 48 C267 48 276 57 279 68 L322 190 C326 201 318 210 307 210 L205 210 C194 210 186 201 190 190 L233 68 C236 57 245 48 256 48 Z"
      fill="#1b1740"
    />
    <rect x="166" y="198" width="180" height="34" rx="17" fill="#1b1740" />
  </g>

  <g fill="#4f46e5">
    <ellipse cx="200" cy="322" rx="24" ry="28" />
    <ellipse cx="312" cy="322" rx="24" ry="28" />
  </g>
</svg>
